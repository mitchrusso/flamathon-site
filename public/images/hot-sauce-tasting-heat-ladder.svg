<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Hot sauce tasting heat ladder</title><desc id="desc">A five-step tasting ladder from aromatic and mild to optional high heat, with stop points.</desc><rect width="1200" height="760" fill="#fff2df"/><text x="75" y="95" font-family="Arial" font-size="28" font-weight="700" fill="#a33820">FLAMATHON HOST GUIDE</text><text x="75" y="165" font-family="Arial" font-size="52" font-weight="800" fill="#2c1a14">Flavor-First Heat Ladder</text><text x="75" y="215" font-family="Arial" font-size="24" fill="#68483d">Tiny portions. Clear labels. Opt out at every round.</text><g font-family="Arial"><rect x="85" y="500" width="190" height="110" rx="18" fill="#f1b84a"/><rect x="295" y="450" width="190" height="160" rx="18" fill="#eb9537"/><rect x="505" y="390" width="190" height="220" rx="18" fill="#df6f2c"/><rect x="715" y="315" width="190" height="295" rx="18" fill="#cc4727"/><rect x="925" y="235" width="190" height="375" rx="18" fill="#a92a24"/><g font-size="23" font-weight="800" text-anchor="middle" fill="#2c1a14"><text x="180" y="650">AROMATIC</text><text x="390" y="650">MILD</text><text x="600" y="650">MEDIUM</text><text x="810" y="650">HOT</text><text x="1020" y="650">OPTIONAL</text></g><g font-size="22" font-weight="700" text-anchor="middle" fill="white"><text x="180" y="555">taste flavor</text><text x="390" y="520">pause</text><text x="600" y="485">water + food</text><text x="810" y="430">check in</text><text x="1020" y="350">never pressure</text></g></g><text x="75" y="700" font-family="Arial" font-size="23" font-weight="700" fill="#68483d">Allergen concern or concerning symptoms? Stop and seek appropriate help.</text></svg>
