<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Let guests add their own sweet heat</title><desc id="desc">Original overhead tasting arrangement with a labeled hot honey jar, separate crackers, cheese and fruit, and a plain opt-out plate.</desc><rect width="1200" height="760" fill="#f6f7f3"/><g font-family="Arial, sans-serif"><text x="65" y="95" font-size="36" fill="#20394a">Let guests add their own sweet heat</text><text x="67" y="144" font-size="20" fill="#20394a">Flameathon • Original editorial illustration</text><rect x="85" y="230" width="300" height="335" rx="45" fill="#e7c993"/><circle cx="233" cy="386" r="90" fill="#c88125"/><rect x="174" y="266" width="118" height="52" rx="12" fill="#394b3a"/><rect x="178" y="345" width="112" height="95" rx="12" fill="#fff0c9"/><text x="192" y="381" font-size="25" fill="#20394a">HOT</text><text x="187" y="416" font-size="25" fill="#20394a">HONEY</text><text x="133" y="533" font-size="24" fill="#20394a">Keep the label</text><circle cx="551" cy="309" r="102" fill="#fff"/><rect x="489" y="275" width="38" height="70" rx="5" fill="#d7b97d"/><rect x="534" y="275" width="38" height="70" rx="5" fill="#d7b97d"/><rect x="579" y="275" width="38" height="70" rx="5" fill="#d7b97d"/><text x="505" y="457" font-size="25" fill="#20394a">Crackers</text><circle cx="831" cy="311" r="103" fill="#fff"/><path d="M766 342 L811 251 L895 342 Z" fill="#ebca6d"/><text x="789" y="457" font-size="25" fill="#20394a">Cheese</text><circle cx="1060" cy="505" r="81" fill="#fff"/><path d="M1011 508 Q1060 420 1109 508 Q1060 569 1011 508" fill="#b4cb8d"/><circle cx="623" cy="578" r="84" fill="#fff"/><text x="585" y="584" font-size="23" fill="#20394a">PLAIN</text><path d="M426 496 L487 531" fill="none" stroke="#63776d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="670" font-size="29" fill="#20394a">Separate utensils • small batches • no pressure to taste</text></g></svg>
